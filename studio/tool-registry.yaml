  - id: khosan-native-3d-evidence-gate
    name: KHOSAN 3D Evidence & Layout Gate v1
    status: evaluate
    priority: p0
    deterministic: true
    owner: 10-qa-playtester
    entrypoint: "node tools/harness-3d/cli.mjs verify <project-root> <evidence-json>"
    input_contract: studio/contracts/3d-verification-evidence.schema.json
    capability: bounded_z_up_cm_aabb_lint_artifact_digest_and_governance_gate
    notes: "17 isolated Node tests pass; gate requires separate Ed25519 reviewer/human public trust anchors; trusted signing services, independent VLM, actual Blender render, authenticated UI and full mesh validation remain pending; not a full production release"
  - id: khosan-native-differential-patch-lock
    name: KHOSAN Part 7 Differential Patch Lock (bounded AABB)
    status: evaluate
    priority: p0
    deterministic: true
    owner: 06-technical-architect
    entrypoint: "tools/ugir-geometry-linter/hard_lock_enforcer.py"
    verification: "python -m unittest discover -s scripts -p test_part7_hard_locks.py"
    capability: source_revision_bound_atomic_coordinate_patch_and_phase_tool_mask
    limitations: "standalone checker only; NOT yet enforced by trusted Studio/DevSpace dispatcher; no native anchors, CSG, skinned meshes, browser UI or authenticated permission boundary"
  - id: khosan-trusted-3d-command-gateway
    name: KHOSAN 3D Signed Protocol Gateway + Local IPC
    status: evaluate
    priority: p0
    deterministic: true
    owner: 00-studio-orchestrator
    entrypoint: "node tools/harness-3d/gateway-daemon.mjs serve <trust-file> <service-key-file> <named-pipe>"
    verification: "npm run verify:gateway"
    capability: scoped_ed25519_tool_authorization_durable_fsm_atomic_geometry_patch_independent_receipts
    restrictions: "must run as separately permissioned Windows service account; never expose private service or reviewer keys to Maker; no remote HTTP mutator"
    notes: "29/29 GitHub Actions signed gateway + IPC tests PASS; real trusted OS ACL/service, actual independent VLM and production renderer remain deployment gates"
