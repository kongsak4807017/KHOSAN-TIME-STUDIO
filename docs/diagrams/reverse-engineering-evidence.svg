<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><title>Evidence-led reverse engineering</title><rect width="1000" height="300" fill="#101827"/><style>text{fill:#fff;font:17px sans-serif}rect.box{fill:#28466a;stroke:#8bd0ff;stroke-width:2}path{stroke:#fff;stroke-width:3;fill:none}</style><text x="30" y="45" font-size="24">Observe → Hypothesize → Reimplement → Verify → Record</text><g><rect class="box" x="25" y="100" width="160" height="80" rx="12"/><text x="48" y="146">Documented</text><rect class="box" x="225" y="100" width="160" height="80" rx="12"/><text x="242" y="146">Hypothesis</text><rect class="box" x="425" y="100" width="160" height="80" rx="12"/><text x="443" y="146">Native Code</text><rect class="box" x="625" y="100" width="160" height="80" rx="12"/><text x="652" y="146">Test + QA</text><rect class="box" x="825" y="100" width="150" height="80" rx="12"/><text x="845" y="146">Evidence</text><path d="M185 140H225M385 140H425M585 140H625M785 140H825"/></g><text x="30" y="245">Never infer proprietary internals from public behavior. No Evidence → No Done.</text></svg>