name: Manual source verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deployable source
        run: node scripts/verify-source.mjs
      - name: Check Node syntax
        run: |
          node --check apps/studio-server/server.mjs
          node --check apps/studio-web/public/app.js
          node --check scripts/smoke-multi-project.mjs
          node --check tools/adapters/image-blaster/doctor.mjs
          node --check tools/adapters/image-blaster/run.mjs
          bash -n scripts/setup-image-blaster.sh
      - name: Verify multi-project workspace runtime
        run: npm run verify:workspace
      - name: Verify harness
        run: python scripts/harness_check.py
      - name: Check Python adapter syntax
        run: python -m py_compile tools/adapters/rigging/common.py tools/adapters/rigging/doctor.py tools/adapters/rigging/rig.py tools/adapters/rigging/validate.py tools/devspace-connectivity/doctor.py
